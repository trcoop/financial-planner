name: Update visual baselines

# Manual trigger for regenerating tests/visual/**/*-snapshots/*.png. Baselines must be
# generated on the same OS as the `visual` CI job (ubuntu-latest) to avoid font-rendering
# diffs, so run this instead of `npm run test:visual:update` locally on a non-Linux machine —
# download the resulting artifact and commit the PNGs it contains.
#
# Run via `gh workflow run "Update visual baselines" --ref <branch>` (or the Actions UI's
# branch selector) — the branch you pick there is what gets checked out below. There is no
# separate `ref` input to set; an older version of this workflow had one, and it was easy to
# set --ref without also setting the input, which silently checked out `main` instead.
on:
  workflow_dispatch: {}

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/**/*-snapshots/*.png
          retention-days: 14
